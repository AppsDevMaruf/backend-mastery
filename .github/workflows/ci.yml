name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: marufalam
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bd_tax_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U marufalam -d bd_tax_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test

      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: marufalam
      DB_PASSWORD: postgres
      DB_NAME: bd_tax_test

      JWT_ACCESS_SECRET: test-access-secret-test-access-secret-1234
      JWT_REFRESH_SECRET: test-refresh-secret-test-refresh-secret-1234
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    defaults:
      run:
        working-directory: 03-projects/project-05-nestjs/first-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 03-projects/project-05-nestjs/first-api/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Run migrations
        run: npm run migration:run

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build


  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: 03-projects/project-05-nestjs/first-api
          file: 03-projects/project-05-nestjs/first-api/Dockerfile
          target: production
          push: true
          tags: |
           ghcr.io/appsdevmaruf/first-api:latest
           ghcr.io/appsdevmaruf/first-api:${{ github.sha }}
            